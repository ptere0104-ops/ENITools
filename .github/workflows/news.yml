name: ENI news snapshot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch @ENI__Official timeline
        run: python fetch_news.py

      - name: Commit when changed
        run: |
          git config user.name "eni-news-bot"
          git config user.email "eni-news-bot@users.noreply.github.com"
          if [ -f news-eni.json ]; then
            git add news-eni.json
            git diff --cached --quiet || git commit -m "chore: update ENI news snapshot"
            git push
          else
            echo "no snapshot produced"
          fi
